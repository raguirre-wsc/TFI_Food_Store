services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: foodstore_tfi
      POSTGRES_USER: foodstore
      POSTGRES_PASSWORD: foodstore
    ports:
      - "5434:5432"
    volumes:
      - foodstore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodstore -d foodstore_tfi"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  foodstore_data:
